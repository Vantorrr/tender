services:
  tenderkontur:
    build: .
    ports:
      - "43141:43141"
    environment:
      PORT: "43141"
      HOST: "0.0.0.0"
      DATA_DIR: /app/data
      SYNC_INTERVAL_MS: "0"
      SESSION_DAYS: "7"
      OCR_PROVIDER: auto
      OCR_LANGS: eng+rus
      MAIL_TRANSPORT: file
      OPENROUTER_ON_UPLOAD: "0"

    volumes:
      - tk_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:43141/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  tk_data:
